*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#080808 url("andrew.jpeg") center center / contain no-repeat;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
body{background-attachment:fixed}
#startScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.22);z-index:5}
#startBtn{font-size:16px;padding:12px 26px;background:#ececec;color:#111;border:2px outset #fff;border-radius:2px;cursor:pointer}
#audio{display:none}
#shade{display:none;position:fixed;inset:0;background:rgba(0,0,0,.22);align-items:center;justify-content:center;padding:20px;z-index:2}

#body{min-height:112px;display:flex;align-items:center;gap:14px;padding:22px 18px;font-size:17px;line-height:1.45;overflow-wrap:anywhere}
#icon{flex:none;width:28px;height:28px;border-radius:50%;background:#2563eb;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold;font-family:serif}
#lyric{flex:1}
#actions{display:flex;justify-content:center;padding:0 16px 16px}
#ok{min-width:82px;padding:6px 18px;border:2px outset #fff;background:#eee;color:#111;font-size:14px;cursor:pointer}
#ok:focus{outline:1px dotted #111;outline-offset:-5px}

<div id="startScreen"><button id="startBtn">▶ Play song</button></div>
<div id="shade" role="dialog" aria-modal="true" aria-labelledby="titlebar">
  <div id="dialog">
    <div id="titlebar">Lyrics — Transform</div>
    <div id="body"><div id="icon">i</div><div id="lyric"></div></div>
    <div id="actions"><button id="ok">OK</button></div>
  </div>
</div>
<script>
const sync = {"title": "Transform — Daniel Caesar", "lines": ["Kusu's my violet....", "In the sun....", "You're the....", "Choosennnn oneeee...", "Save my soul my dear like Jesus<3333...."], "timestamps": [0, 8.085539, 14.361303, 17.819844, 27.074467]};
const audio = document.getElementById('audio');
const startScreen = document.getElementById('startScreen');
const startBtn = document.getElementById('startBtn');
const shade = document.getElementById('shade');
const lyric = document.getElementById('lyric');
const ok = document.getElementById('ok');
let nextIndex = 0;
let popupOpen = false;
function showDueLyrics() {
  if (popupOpen || nextIndex >= sync.lines.length) return;
  if (audio.currentTime + 0.04 >= Number(sync.timestamps[nextIndex])) {
    lyric.textContent = sync.lines[nextIndex];
    shade.style.display = 'flex';
    popupOpen = true;
    ok.focus();
  }
}
startBtn.addEventListener('click', async () => {
  try {
    await audio.play();
    startScreen.style.display = 'none';
    showDueLyrics();
  } catch (e) {
    startBtn.textContent = 'Tap to play song';
  }
});
audio.addEventListener('timeupdate', showDueLyrics);
audio.addEventListener('seeked', showDueLyrics);
ok.addEventListener('click', () => {
  if (!popupOpen) return;
  popupOpen = false;
  shade.style.display = 'none';
  nextIndex++;
  showDueLyrics();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && popupOpen) ok.click();
});
audio.addEventListener('ended', () => {
  if (nextIndex < sync.lines.length && !popupOpen) showDueLyrics();
});
</script>
